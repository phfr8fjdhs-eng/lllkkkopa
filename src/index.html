<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grenzland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<canvas id="cv" aria-label="Spielkarte"></canvas>

<div id="hud" class="hud" hidden>
  <div class="top">
    <div class="lb panel" id="lb">
      <button class="lb-head" id="lbToggle" type="button" aria-expanded="true">
        <span>Rangliste</span><span class="lb-n" id="lbCount" title="Spieler im Spiel"></span><span class="lb-chev" id="lbChev"></span>
      </button>
      <div class="lb-body" id="lbBody"></div>
    </div>
    <div class="tools">
      <span class="clock panel" id="clock">0:00</span>
      <button class="tool panel" id="btnPause" type="button" aria-label="Pause"></button>
      <button class="tool panel" id="btnSpeed" type="button" aria-label="Geschwindigkeit">1×</button>
      <button class="tool panel" id="btnHome" type="button" aria-label="Zu meinem Gebiet"></button>
      <button class="tool panel" id="btnMenu" type="button" aria-label="Menü"></button>
    </div>
  </div>

  <div class="spawn panel" id="spawnBar" hidden>
    <div class="spawn-row">
      <div class="spawn-t" id="spawnText"></div>
      <button class="btn small" id="spawnGo" type="button" hidden>Jetzt starten</button>
    </div>
    <div class="spawn-bar"><i id="spawnFill"></i></div>
  </div>

  <div class="bottom">
    <div class="events" id="events" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <div class="ctrl panel" id="ctrl">
      <div class="stat">
        <div class="k"><span>Truppen</span><span class="sub" id="sTroopsSub"></span></div>
        <b id="sTroops">0</b>
      </div>
      <div class="stat">
        <div class="k"><span>Gold</span><span class="sub" id="sGoldSub"></span></div>
        <b id="sGold" class="gold">0</b>
      </div>
      <div class="ratio">
        <label for="ratio"><span>Angriffsstärke</span><b id="ratioVal">20 %</b></label>
        <input id="ratio" type="range" min="1" max="100" step="1" value="20">
      </div>
    </div>
  </div>
</div>

<div id="radial" class="radial" hidden>
  <button class="rb" id="rbBuild" type="button" style="--x:0px;--y:-84px"><i></i><span>Bauen</span></button>
  <button class="rb" id="rbAlly" type="button" style="--x:60px;--y:-60px"><i></i><span>Allianz</span></button>
  <button class="rb" id="rbInfo" type="button" style="--x:84px;--y:0px"><i></i><span>Info</span></button>
  <button class="rb" id="rbClose" type="button" style="--x:0px;--y:84px"><i></i><span>Zu</span></button>
  <button class="rb" id="rbBoat" type="button" style="--x:-84px;--y:0px"><i></i><span>Boot</span></button>
  <button class="rb center" id="rbC" type="button" style="--x:0px;--y:0px"><i></i><span></span></button>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden role="status"></div>

<div id="start" class="overlay start">
  <div class="card start-card">
    <header class="brand">
      <h1>Grenzland</h1>
      <p>Erobere die Karte, Feld für Feld. Gegen Stämme und Nationen.</p>
    </header>

    <div class="row two">
      <div class="field">
        <label for="inName">Dein Name</label>
        <input id="inName" type="text" maxlength="16" value="Spieler" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <span class="lab" id="colLab">Farbe</span>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="colLab"></div>
      </div>
    </div>

    <div class="field">
      <span class="lab" id="modeLab">Modus</span>
      <div class="seg two" id="mode" role="radiogroup" aria-labelledby="modeLab">
        <button type="button" role="radio" data-v="ffa">Alle gegen alle</button>
        <button type="button" role="radio" data-v="duel">Duell 1 gegen 1</button>
      </div>
    </div>

    <div class="field">
      <span class="lab" id="mapLab">Karte</span>
      <div class="maps" id="maps" role="radiogroup" aria-labelledby="mapLab"></div>
    </div>

    <div class="field">
      <span class="lab" id="diffLab">Stärke der Gegner</span>
      <div class="seg" id="diff" role="radiogroup" aria-labelledby="diffLab"></div>
    </div>

    <div class="field">
      <label for="inBots">Stämme (Bots) <b id="botsVal">150</b></label>
      <input id="inBots" type="range" min="0" max="400" step="10" value="150">
    </div>

    <div class="field">
      <span class="lab">Optionen</span>
      <div class="opts">
        <label class="opt"><input type="checkbox" id="optNations" checked><span>Nationen</span></label>
        <label class="opt"><input type="checkbox" id="optInstant"><span>Sofort bauen</span></label>
        <label class="opt"><input type="checkbox" id="optGold"><span>Unendlich Gold</span></label>
        <label class="opt"><input type="checkbox" id="optTroops"><span>Unendlich Truppen</span></label>
      </div>
    </div>

    <div class="start-actions">
      <button class="btn big" id="btnStart" type="button">Spiel starten</button>
      <button class="btn ghost" id="btnHelp" type="button">So wird gespielt</button>
    </div>
  </div>
</div>

<div id="modal" class="overlay" hidden><div class="card" id="modalCard" role="dialog" aria-modal="true"></div></div>
<div id="loading" class="overlay loading" hidden><div class="load-box"><div class="spinner"></div><p id="loadText">Karte wird aufgebaut …</p></div></div>

<script>
/*JS*/
</script>
</body>
</html>
