<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grenzland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world, by choice: a sea chart at night.
     Layout: the map fills the screen; ranking top left, tools top right,
     messages stack above the control bar at the bottom; menus rise from below. */
  --sea: #1e4a7c;
  --panel: rgba(12, 21, 32, 0.9);
  --panel-solid: #111c29;
  --line: rgba(190, 215, 240, 0.16);
  --ink: #eaf1f7;
  --muted: #93a6b8;
  --accent: #f4b740;
  --accent-ink: #1c1505;
  --good: #63d391;
  --bad: #ff6b5e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sea); color: var(--ink); font: 500 15px/1.35 var(--body);
  overflow: hidden; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { position: absolute; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}

/* ranking */
#lb { position: absolute; left: 8px; top: 56px; width: min(62vw, 240px); overflow: hidden; }
#lbHead {
  display: flex; justify-content: space-between; align-items: baseline; width: 100%; background: none; border: 0;
  padding: 7px 10px 6px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
#lbHead span:last-child { letter-spacing: .02em; text-transform: none; font-size: 12px; }
.lbrow {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) 38px 46px; gap: 5px; align-items: center; width: 100%;
  padding: 4px 10px; font-size: 13px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
}
.lbrow i { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbrow > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbrow b { font: 600 14px var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.lbrow.me { background: rgba(244, 183, 64, 0.16); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(255, 255, 255, 0.5); }
.dot.big { width: 34px; height: 34px; margin: 0; flex: none; border-width: 2px; }

/* tools */
#tools { position: absolute; right: 8px; top: 8px; display: flex; align-items: center; padding: 3px; }
#clock { font: 600 17px var(--display); padding: 0 6px 0 8px; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.tb { width: 36px; height: 38px; display: grid; place-items: center; background: none; border: 0; border-radius: 9px; padding: 0; }
.tb:active { background: rgba(255, 255, 255, 0.12); }
.tb { transition: background .12s; }
#bSpeed { font: 700 16px var(--display); }

/* start-point banner */
#spawnBar { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: min(92vw, 330px); padding: 10px 16px 12px; text-align: center; pointer-events: none; }
#spawnBar strong { display: block; font: 700 21px/1.1 var(--display); letter-spacing: .01em; }
#spawnBar span { color: var(--muted); font-size: 13px; }
.bar { height: 4px; margin-top: 9px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.14); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }

/* bottom: messages and control bar */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#feed, #feedMsgs, #feedLive { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.msg {
  pointer-events: auto; max-width: 100%; padding: 5px 10px; font-size: 13px; background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px;
}
.msg.good { border-left-color: var(--good); }
.msg.bad { border-left-color: var(--bad); }
.msg.warn { border-left-color: var(--accent); }
.msg.chip { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 10px; min-height: 30px; font-variant-numeric: tabular-nums; }
.msg.chip.bad { padding-right: 10px; }
.msg.chip button { width: 28px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 6px; background: rgba(255, 255, 255, 0.1); padding: 0; }
.msg.ask { border-left-color: var(--accent); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 8px 6px 10px; }
.msg.ask div { display: flex; gap: 6px; }
.msg.ask button { border: 0; border-radius: 7px; padding: 6px 11px; font: 600 14px var(--display); letter-spacing: .02em; background: rgba(255, 255, 255, 0.12); }
.msg.ask .yes { background: var(--accent); color: var(--accent-ink); }
#ctrl { pointer-events: auto; padding: 9px 12px 8px; position: relative; z-index: 2; }
.stats { display: flex; gap: 12px; }
.stat { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.stat > span { color: var(--muted); display: grid; }
.stat.gold > span { color: var(--accent); }
.stat.gold { position: relative; }
.stat.gold.flash b { animation: goldFlash 1.3s ease-out; }
@keyframes goldFlash { 0%, 40% { color: #ffd25e; transform: scale(1.18); transform-origin: left center; } 100% { color: var(--ink); transform: none; } }
#goldPop { position: absolute; left: 30px; top: -6px; font: 700 20px var(--display); color: #ffd25e; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); opacity: 0; pointer-events: none; white-space: nowrap; }
#goldPop.go { animation: goldUp 1.8s ease-out; }
@keyframes goldUp { 0% { opacity: 0; transform: translateY(6px) scale(.7); } 15% { opacity: 1; transform: translateY(-14px) scale(1.15); } 70% { opacity: 1; transform: translateY(-30px) scale(1); } 100% { opacity: 0; transform: translateY(-44px); } }
.stat b { display: block; font: 700 21px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.ratio { display: grid; grid-template-columns: auto 1fr 46px; align-items: center; gap: 10px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.ratio b { color: var(--ink); font: 700 16px var(--display); }
.ratio > span:last-child { text-align: right; color: var(--ink); font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; height: 30px; margin: 0; accent-color: var(--accent); }

/* circle menu: a ring of four wedges around the main action */
#radial { position: absolute; width: 0; height: 0; z-index: 30; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5)); }
.ring {
  position: absolute; left: -106px; top: -106px; width: 212px; height: 212px; border-radius: 50%; overflow: hidden;
  transform: rotate(45deg); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  animation: ringIn .16s ease-out;
}
@keyframes ringIn { from { transform: rotate(45deg) scale(.72); opacity: 0; } }
.seg {
  position: relative; padding: 0; border: 0; color: var(--ink);
  background: linear-gradient(135deg, #1b2a3c, #142130); transition: background .12s;
}
.seg:active:not(:disabled) { background: #2a4058; }
.seg .in {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-45deg); display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: 600 11px var(--display); letter-spacing: .07em; text-transform: uppercase;
}
.seg:disabled .in { opacity: .3; }
#rW.danger { background: linear-gradient(135deg, #8a2b24, #6b1f1a); }
.hub {
  position: absolute; left: -43px; top: -43px; width: 86px; height: 86px; padding: 0; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 700 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent-ink); background: radial-gradient(circle at 35% 28%, #ffd476, var(--accent) 62%);
  border: 4px solid #0c1520; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
  animation: hubIn .18s ease-out;
}
@keyframes hubIn { from { transform: scale(.6); opacity: 0; } }
.hub:active { transform: scale(.95); }
.hub.off { background: #1b2a3c; color: var(--muted); box-shadow: none; }
#rCap {
  position: absolute; left: 0; top: -146px; transform: translateX(-50%); white-space: nowrap; max-width: 86vw; overflow: hidden; text-overflow: ellipsis;
  padding: 5px 13px; font: 600 14px var(--display); letter-spacing: .02em; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px;
}

/* build menu */
#sheet { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 13, 23, 0.45); }
.sheetCard { width: min(100%, 540px); max-height: 84%; overflow: auto; padding: 12px 12px 16px; border-radius: 18px 18px 0 0; border-bottom: 0; animation: sheetIn .2s ease-out; }
@keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } }
.sheetHead { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.sheetHead h2 { margin: 0; flex: 1; font: 700 24px var(--display); }
#purse { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; font: 700 16px var(--display); color: var(--accent); background: rgba(244, 183, 64, 0.12); border-radius: 999px; font-variant-numeric: tabular-nums; }
#sheetBody h3 { margin: 12px 2px 6px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.item {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 124px; padding: 10px 5px 9px; text-align: center;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04)); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); transition: transform .08s, border-color .12s;
}
.item:active:not(:disabled) { transform: scale(.96); border-color: var(--accent); }
.ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; color: #cfe3f7; background: rgba(110, 170, 230, 0.16); flex: none; }
.ic.big { width: 54px; height: 54px; border-radius: 14px; }
.item.nuke .ic { color: #ffb4a8; background: rgba(255, 107, 94, 0.16); }
.item b { font: 600 14.5px/1.1 var(--display); letter-spacing: .01em; hyphens: manual; overflow-wrap: break-word; margin-top: 3px; }
.item small { flex: 1; font-size: 11px; line-height: 1.2; color: var(--muted); }
.price { display: inline-flex; align-items: center; gap: 4px; font: 700 14.5px var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.item .price { padding: 2px 8px; background: rgba(244, 183, 64, 0.12); border-radius: 999px; }
.item:disabled { opacity: .48; }
.item:disabled .price { color: var(--muted); background: rgba(255, 255, 255, 0.06); }
.own { position: absolute; right: 6px; top: 6px; min-width: 20px; padding: 0 5px; font: 700 12.5px/20px var(--display); font-style: normal; color: var(--ink); background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
.scard { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 10px 12px; border: 1px solid rgba(244, 183, 64, 0.55); border-radius: 13px; background: rgba(244, 183, 64, 0.07); }
.scard .ic { color: var(--accent); background: rgba(244, 183, 64, 0.16); }
.scard { flex-direction: column; align-items: stretch; }
.shead { display: flex; align-items: center; gap: 12px; }
.uprow { display: flex; gap: 6px; }
.uprow .upbtn { flex: 1; min-width: 0; }
.lvbar { height: 6px; margin: 6px 0 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.lvbar i { display: block; height: 100%; min-width: 3px; border-radius: 3px; background: var(--accent); }
.sinfo { flex: 1; min-width: 0; }
.sinfo b { display: block; font: 700 18px/1.1 var(--display); }
.sinfo small { display: block; font-size: 12px; line-height: 1.3; color: var(--muted); }
.sinfo small.next { color: var(--good); }
.pips { display: flex; gap: 4px; margin: 5px 0 4px; }
.pips i { width: 16px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); }
.pips i.on { background: var(--accent); }
.upbtn {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 12px; border: 0; border-radius: 11px;
  font: 700 14px var(--display); letter-spacing: .03em; color: var(--accent-ink); background: linear-gradient(180deg, #ffcc66, var(--accent)); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
}
.upbtn .price { color: var(--accent-ink); }
.upbtn:disabled { opacity: .45; }
.upbtn:active:not(:disabled) { transform: scale(.96); }

/* aiming a bomb */
#aimBar { pointer-events: auto; padding: 10px 12px 12px; border-color: rgba(255, 107, 94, 0.6); }
.aimTop { display: flex; align-items: center; gap: 11px; }
.aimTop .ic { color: #ffb4a8; background: rgba(255, 107, 94, 0.16); }
.aimTop b { display: flex; align-items: baseline; gap: 10px; font: 700 20px/1.1 var(--display); }
.aimTop small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
.aimTop small.warn { color: #ffb4a8; }
.aimBtns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 10px; }
.aimBtns .btn { margin: 0; padding: 11px 8px; font-size: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; }

/* dialogs */
#modal { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px; background: rgba(5, 13, 23, 0.5); }
.card { width: min(100%, 430px); max-height: 100%; overflow: auto; padding: 16px 16px 14px; }
.card h1 { margin: 0; font: 700 38px/1 var(--display); letter-spacing: .01em; }
.card h1 small { margin-left: 6px; font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); vertical-align: middle; }
.card h2 { margin: 0; font: 700 26px/1.1 var(--display); text-wrap: balance; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.field { margin-top: 11px; }
.field > label, .lab { display: block; margin-bottom: 6px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field > label b { color: var(--ink); font-size: 14px; letter-spacing: 0; }
input[type=text] { width: 100%; padding: 8px 11px; font: 500 16px var(--body); color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 9px; }
.swatches { display: flex; gap: 9px; }
.sw { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.25); }
.sw[aria-pressed=true] { border-color: #fff; box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* map picker: two rows of cards that scroll sideways */
.lab2 { margin-top: 10px; }
.hint { margin: 6px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
.maprow { display: flex; gap: 8px; margin: 0 -16px; padding: 2px 16px 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; }
.mapc {
  flex: none; width: 112px; padding: 0 0 6px; text-align: left; scroll-snap-align: center; overflow: hidden;
  background: rgba(255, 255, 255, 0.06); border: 2px solid var(--line); border-radius: 10px;
}
.mapc canvas { display: block; width: 100%; height: auto; aspect-ratio: 132 / 84; }
.mapc b { display: block; padding: 5px 7px 0; font: 600 15px/1.1 var(--display); }
.mapc small { display: block; padding: 1px 7px 0; font-size: 11px; line-height: 1.2; color: var(--muted); }
.mapc[aria-pressed=true] { border-color: var(--accent); background: rgba(244, 183, 64, 0.14); }
.mapc[aria-pressed=true] b { color: var(--accent); }
kbd {
  display: inline-block; min-width: 20px; padding: 1px 5px; font: 600 12px var(--display); text-align: center; color: var(--ink);
  background: rgba(255, 255, 255, 0.1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
}
.item { position: relative; }
.item > kbd { position: absolute; left: 5px; top: 5px; display: none; }
.card .h3 { margin-top: 16px; font-size: 20px; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; font-size: 13px; }
.keys span { display: flex; align-items: center; gap: 4px; }
.keys kbd:last-of-type { margin-right: 4px; }
@media (hover: hover) and (pointer: fine) { .item > kbd { display: block; } }
.chipb { padding: 6px 11px; font-size: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 999px; }
.chipb[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { padding: 9px 2px; font-size: 13.5px; background: rgba(255, 255, 255, 0.05); border: 0; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 14px; }
.check.wide { margin-top: 12px; }
#bSound[aria-pressed=false] { color: var(--muted); }
body.placing #cv { cursor: crosshair; }
.check input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 11px;
  font: 700 20px var(--display); letter-spacing: .03em; color: var(--accent-ink);
  background: linear-gradient(180deg, #ffcc66, var(--accent)); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.25);
  transition: transform .08s, filter .12s;
}
.btn:active:not(:disabled) { transform: translateY(1px) scale(.985); filter: brightness(.95); }
.btn.alt { margin-top: 8px; color: #06131f; background: linear-gradient(180deg, #8cc8ff, #5aa9ef); }
.btn.ghost { margin-top: 8px; padding: 10px; font-size: 16px; font-weight: 600; color: var(--ink); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); box-shadow: none; }
.btn.danger { margin-top: 8px; padding: 10px; font-size: 16px; color: #2b0704; background: linear-gradient(180deg, #ff8a7e, var(--bad)); }
.btn:disabled { opacity: .45; }
.code { font-family: var(--display); letter-spacing: .14em; color: var(--accent); }
.linkrow { display: flex; gap: 6px; margin-top: 10px; }
.linkrow input { flex: 1; min-width: 0; font-size: 13px; }
.linkrow .tb { width: 42px; height: auto; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); }
.lab.top { margin-top: 14px; }
.plist { display: grid; gap: 4px; }
.plist div { display: flex; align-items: center; padding: 7px 10px; font-size: 15px; background: rgba(255, 255, 255, 0.06); border-radius: 9px; }
.plist i { margin-left: 8px; padding: 1px 7px; font: 600 11px var(--display); font-style: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.who { display: flex; align-items: center; gap: 12px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.facts div { padding: 7px 9px; background: rgba(255, 255, 255, 0.06); border-radius: 9px; }
.facts small { display: block; font-size: 11.5px; color: var(--muted); }
.facts b { font: 700 19px var(--display); font-variant-numeric: tabular-nums; }
.facts.six { grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
.facts.six div { padding: 5px 2px; text-align: center; }
.facts.six small { font-size: 10px; }
.facts.six b { font-size: 16px; }
.card p.notes { margin-top: 10px; color: var(--ink); font-size: 13.5px; }
.help { margin: 10px 0 0; padding: 0 0 0 18px; font-size: 14px; }
.help li { margin-top: 7px; }
.help b { color: var(--accent); font-weight: 600; }
#toast {
  position: absolute; left: 50%; bottom: 132px; transform: translateX(-50%); z-index: 60; pointer-events: none; white-space: nowrap;
  max-width: 92vw; overflow: hidden; text-overflow: ellipsis; padding: 7px 14px; font-size: 14px;
  background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}
@media (min-width: 700px) {
  #lb { top: 8px; width: 270px; }
  .grid { grid-template-columns: repeat(3, 1fr); }
  .item { cursor: pointer; }
  .item:hover:not(:disabled) { border-color: rgba(244, 183, 64, 0.7); }
  .seg:hover:not(:disabled) { background: #22364b; }
  .btn:hover:not(:disabled) { filter: brightness(1.06); }
  #bottom { left: 0; right: auto; margin: 0; width: 440px; }
  #toast { bottom: 40px; }
  #sheet { align-items: center; }
  .sheetCard { border-radius: 18px; border-bottom: 1px solid var(--line); }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="hud" hidden>
    <div id="lb" class="panel">
      <button id="lbHead" type="button" aria-expanded="false"><span>Rangliste</span><span id="lbCount"></span></button>
      <div id="lbRows"></div>
    </div>
    <div id="tools" class="panel">
      <span id="clock">0:00</span>
      <button id="bPause" class="tb" type="button" aria-label="Pause"></button>
      <button id="bSpeed" class="tb" type="button" aria-label="Tempo">1×</button>
      <button id="bHome" class="tb" type="button" aria-label="Zu meinem Gebiet"></button>
      <button id="bSound" class="tb" type="button" aria-label="Ton aus" aria-pressed="true"></button>
      <button id="bMenu" class="tb" type="button" aria-label="Menü"></button>
    </div>
    <div id="spawnBar" class="panel">
      <strong>Wähle deinen Startpunkt</strong>
      <span id="spawnHint">Tippe auf freies Land</span>
      <div class="bar" id="spawnBarLine" hidden><i id="spawnFill"></i></div>
    </div>
    <div id="bottom">
      <div id="feed"><div id="feedMsgs"></div><div id="feedLive"></div></div>
      <div id="ctrl" class="panel">
        <div class="stats">
          <div class="stat"><span id="icTroops"></span><div><b id="sTroops">0</b><small id="sTroopsSub">Truppen</small></div></div>
          <div class="stat gold" id="statGold"><span id="icGold"></span><div><b id="sGold">0</b><small id="sGoldSub">Gold</small></div><span id="goldPop" aria-hidden="true"></span></div>
        </div>
        <label class="ratio" for="ratio"><span>Angriff <b id="ratioPct">20%</b></span><input id="ratio" type="range" min="1" max="100" value="20"><span id="ratioTroops">0</span></label>
      </div>
      <div id="aimBar" class="panel" hidden>
        <div class="aimTop"><span class="ic" id="aimIc"></span><div><b><span id="aimName"></span><span id="aimCost"></span></b><small id="aimInfo"></small></div></div>
        <div class="legend"><span><i style="background:#ff6b5e"></i>Einschlag und Radius</span><span><i style="background:#ffd65e"></i>Flugbahn</span><span><i style="border:1.5px dashed #c58bff"></i>Flugabwehr der Gegner</span><span><i style="border:1.5px dashed #63d391"></i>Eigene Flugabwehr</span></div>
        <div class="aimBtns"><button id="aimNo" class="btn ghost" type="button"></button><button id="aimGo" class="btn danger" type="button">Abfeuern</button></div>
      </div>
    </div>
  </div>
  <div id="radial" hidden>
    <div id="rCap"></div>
    <div class="ring">
      <button id="rN" class="seg" type="button"></button>
      <button id="rE" class="seg" type="button"></button>
      <button id="rW" class="seg" type="button"></button>
      <button id="rS" class="seg" type="button"></button>
    </div>
    <button id="rC" class="hub" type="button"></button>
  </div>
  <div id="sheet" hidden>
    <div class="sheetCard panel">
      <div class="sheetHead"><h2>Bauen</h2><span id="purse"></span><button id="sheetClose" class="tb" type="button" aria-label="Schliessen"></button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <div id="modal" hidden><div id="modalCard" class="card panel"></div></div>
  <div id="toast" hidden></div>
</div>
<script>
/*__JS__*/
G.boot(/*__MAPS__*/);
</script>
</body>
</html>
