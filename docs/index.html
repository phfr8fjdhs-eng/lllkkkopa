<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grenzland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* One visual world, by choice: a sea chart at night.
     Layout: the map fills the screen; ranking top left, tools top right,
     messages stack above the control bar at the bottom; menus rise from below. */
  --sea: #1e4a7c;
  --panel: rgba(12, 21, 32, 0.9);
  --panel-solid: #111c29;
  --line: rgba(190, 215, 240, 0.16);
  --ink: #eaf1f7;
  --muted: #93a6b8;
  --accent: #f4b740;
  --accent-ink: #1c1505;
  --good: #63d391;
  --bad: #ff6b5e;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--sea); color: var(--ink); font: 500 15px/1.35 var(--body);
  overflow: hidden; user-select: none; -webkit-user-select: none; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { position: absolute; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}

/* ranking */
#lb { position: absolute; left: 8px; top: 56px; width: min(62vw, 240px); overflow: hidden; }
#lbHead {
  display: flex; justify-content: space-between; align-items: baseline; width: 100%; background: none; border: 0;
  padding: 7px 10px 6px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
#lbHead span:last-child { letter-spacing: .02em; text-transform: none; font-size: 12px; }
.lbrow {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) 38px 46px; gap: 5px; align-items: center; width: 100%;
  padding: 4px 10px; font-size: 13px; text-align: left; background: none; border: 0; border-top: 1px solid var(--line);
}
.lbrow i { font-style: normal; color: var(--muted); font-variant-numeric: tabular-nums; }
.lbrow > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lbrow b { font: 600 14px var(--display); text-align: right; font-variant-numeric: tabular-nums; }
.lbrow.me { background: rgba(244, 183, 64, 0.16); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(255, 255, 255, 0.5); }
.dot.big { width: 34px; height: 34px; margin: 0; flex: none; border-width: 2px; }

/* tools */
#tools { position: absolute; right: 8px; top: 8px; display: flex; align-items: center; padding: 3px; }
#clock { font: 600 17px var(--display); padding: 0 6px 0 8px; min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
.tb { width: 36px; height: 38px; display: grid; place-items: center; background: none; border: 0; border-radius: 9px; padding: 0; }
.tb:active { background: rgba(255, 255, 255, 0.12); }
.tb { transition: background .12s; }
#bSpeed { font: 700 16px var(--display); }

/* start-point banner */
#spawnBar { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); width: min(92vw, 330px); padding: 10px 16px 12px; text-align: center; pointer-events: none; }
#spawnBar strong { display: block; font: 700 21px/1.1 var(--display); letter-spacing: .01em; }
#spawnBar span { color: var(--muted); font-size: 13px; }
.bar { height: 4px; margin-top: 9px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.14); }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }

/* bottom: messages and control bar */
#bottom { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
#feed, #feedMsgs, #feedLive { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.msg {
  pointer-events: auto; max-width: 100%; padding: 5px 10px; font-size: 13px; background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: 8px;
}
.msg.good { border-left-color: var(--good); }
.msg.bad { border-left-color: var(--bad); }
.msg.warn { border-left-color: var(--accent); }
.msg.chip { display: flex; align-items: center; gap: 8px; padding: 2px 4px 2px 10px; min-height: 30px; font-variant-numeric: tabular-nums; }
.msg.chip.bad { padding-right: 10px; }
.msg.chip button { width: 28px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 6px; background: rgba(255, 255, 255, 0.1); padding: 0; }
.msg.ask { border-left-color: var(--accent); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 8px 6px 10px; }
.msg.ask div { display: flex; gap: 6px; }
.msg.ask button { border: 0; border-radius: 7px; padding: 6px 11px; font: 600 14px var(--display); letter-spacing: .02em; background: rgba(255, 255, 255, 0.12); }
.msg.ask .yes { background: var(--accent); color: var(--accent-ink); }
#ctrl { pointer-events: auto; padding: 9px 12px 8px; position: relative; z-index: 2; }
.stats { display: flex; gap: 12px; }
.stat { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.stat > span { color: var(--muted); display: grid; }
.stat.gold > span { color: var(--accent); }
.stat.gold { position: relative; }
.stat.gold.flash b { animation: goldFlash 1.3s ease-out; }
@keyframes goldFlash { 0%, 40% { color: #ffd25e; transform: scale(1.18); transform-origin: left center; } 100% { color: var(--ink); transform: none; } }
#goldPop { position: absolute; left: 30px; top: -2px; font: 600 14px var(--display); color: #ffe08a; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8); opacity: 0; pointer-events: none; white-space: nowrap; }
#goldPop.go { animation: goldUp 1.8s ease-out; }
@keyframes goldUp { 0% { opacity: 0; transform: translateY(6px) scale(.7); } 15% { opacity: 1; transform: translateY(-14px) scale(1.15); } 70% { opacity: 1; transform: translateY(-30px) scale(1); } 100% { opacity: 0; transform: translateY(-44px); } }
.stat b { display: block; font: 700 21px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.ratio { display: grid; grid-template-columns: auto 1fr 46px; align-items: center; gap: 10px; margin-top: 4px; font-size: 13px; color: var(--muted); }
.ratio b { color: var(--ink); font: 700 16px var(--display); }
.ratio > span:last-child { text-align: right; color: var(--ink); font: 600 15px var(--display); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; height: 30px; margin: 0; accent-color: var(--accent); }

/* circle menu: a ring of four wedges around the main action */
#radial { position: absolute; width: 0; height: 0; z-index: 30; filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5)); }
.ring {
  position: absolute; left: -106px; top: -106px; width: 212px; height: 212px; border-radius: 50%; overflow: hidden;
  transform: rotate(45deg); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px;
  animation: ringIn .16s ease-out;
}
@keyframes ringIn { from { transform: rotate(45deg) scale(.72); opacity: 0; } }
.seg {
  position: relative; padding: 0; border: 0; color: var(--ink);
  background: linear-gradient(135deg, #1b2a3c, #142130); transition: background .12s;
}
.seg:active:not(:disabled) { background: #2a4058; }
.seg .in {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-45deg); display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: 600 11px var(--display); letter-spacing: .07em; text-transform: uppercase;
}
.seg:disabled .in { opacity: .3; }
#rW.danger { background: linear-gradient(135deg, #8a2b24, #6b1f1a); }
.hub {
  position: absolute; left: -43px; top: -43px; width: 86px; height: 86px; padding: 0; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  font: 700 11.5px var(--display); letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent-ink); background: radial-gradient(circle at 35% 28%, #ffd476, var(--accent) 62%);
  border: 4px solid #0c1520; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18);
  animation: hubIn .18s ease-out;
}
@keyframes hubIn { from { transform: scale(.6); opacity: 0; } }
.hub:active { transform: scale(.95); }
.hub.off { background: #1b2a3c; color: var(--muted); box-shadow: none; }
#rCap {
  position: absolute; left: 0; top: -146px; transform: translateX(-50%); white-space: nowrap; max-width: 86vw; overflow: hidden; text-overflow: ellipsis;
  padding: 5px 13px; font: 600 14px var(--display); letter-spacing: .02em; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 999px;
}

/* build menu */
#sheet { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: rgba(5, 13, 23, 0.45); }
.sheetCard { width: min(100%, 540px); max-height: 84%; overflow: auto; padding: 12px 12px 16px; border-radius: 18px 18px 0 0; border-bottom: 0; animation: sheetIn .2s ease-out; }
@keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } }
.sheetHead { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.sheetHead h2 { margin: 0; flex: 1; font: 700 24px var(--display); }
#purse { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; font: 700 16px var(--display); color: var(--accent); background: rgba(244, 183, 64, 0.12); border-radius: 999px; font-variant-numeric: tabular-nums; }
#sheetBody h3 { margin: 12px 2px 6px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.item {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 124px; padding: 10px 5px 9px; text-align: center;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.04)); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06); transition: transform .08s, border-color .12s;
}
.item:active:not(:disabled) { transform: scale(.96); border-color: var(--accent); }
.ic { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; color: #cfe3f7; background: rgba(110, 170, 230, 0.16); flex: none; }
.ic.big { width: 54px; height: 54px; border-radius: 14px; }
.item.nuke .ic { color: #ffb4a8; background: rgba(255, 107, 94, 0.16); }
.item b { font: 600 14.5px/1.1 var(--display); letter-spacing: .01em; hyphens: manual; overflow-wrap: break-word; margin-top: 3px; }
.item small { flex: 1; font-size: 11px; line-height: 1.2; color: var(--muted); }
.price { display: inline-flex; align-items: center; gap: 4px; font: 700 14.5px var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.item .price { padding: 2px 8px; background: rgba(244, 183, 64, 0.12); border-radius: 999px; }
.item:disabled { opacity: .48; }
.item:disabled .price { color: var(--muted); background: rgba(255, 255, 255, 0.06); }
.own { position: absolute; right: 6px; top: 6px; min-width: 20px; padding: 0 5px; font: 700 12.5px/20px var(--display); font-style: normal; color: var(--ink); background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
.scard { display: flex; align-items: center; gap: 12px; margin-top: 8px; padding: 10px 12px; border: 1px solid rgba(244, 183, 64, 0.55); border-radius: 13px; background: rgba(244, 183, 64, 0.07); }
.scard .ic { color: var(--accent); background: rgba(244, 183, 64, 0.16); }
.scard { flex-direction: column; align-items: stretch; }
.shead { display: flex; align-items: center; gap: 12px; }
.uprow { display: flex; gap: 6px; }
.uprow .upbtn { flex: 1; min-width: 0; }
.lvbar { height: 6px; margin: 6px 0 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); overflow: hidden; }
.lvbar i { display: block; height: 100%; min-width: 3px; border-radius: 3px; background: var(--accent); }
.sinfo { flex: 1; min-width: 0; }
.sinfo b { display: block; font: 700 18px/1.1 var(--display); }
.sinfo small { display: block; font-size: 12px; line-height: 1.3; color: var(--muted); }
.sinfo small.next { color: var(--good); }
.pips { display: flex; gap: 4px; margin: 5px 0 4px; }
.pips i { width: 16px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, 0.16); }
.pips i.on { background: var(--accent); }
.upbtn {
  display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 12px; border: 0; border-radius: 11px;
  font: 700 14px var(--display); letter-spacing: .03em; color: var(--accent-ink); background: linear-gradient(180deg, #ffcc66, var(--accent)); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.18);
}
.upbtn .price { color: var(--accent-ink); }
.upbtn:disabled { opacity: .45; }
.upbtn:active:not(:disabled) { transform: scale(.96); }

/* aiming a bomb */
#aimBar { pointer-events: auto; padding: 10px 12px 12px; border-color: rgba(255, 107, 94, 0.6); }
.aimTop { display: flex; align-items: center; gap: 11px; }
.aimTop .ic { color: #ffb4a8; background: rgba(255, 107, 94, 0.16); }
.aimTop b { display: flex; align-items: baseline; gap: 10px; font: 700 20px/1.1 var(--display); }
.aimTop small { display: block; margin-top: 2px; font-size: 12.5px; line-height: 1.3; color: var(--muted); }
.aimTop small.warn { color: #ffb4a8; }
.aimBtns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 10px; }
.aimBtns .btn { margin: 0; padding: 11px 8px; font-size: 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: -1px; }

/* dialogs */
#modal { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 14px; background: rgba(5, 13, 23, 0.5); }
.card { width: min(100%, 430px); max-height: 100%; overflow: auto; padding: 16px 16px 14px; }
.card h1 { margin: 0; font: 700 38px/1 var(--display); letter-spacing: .01em; }
.card h1 small { margin-left: 6px; font: 600 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); vertical-align: middle; }
.card h2 { margin: 0; font: 700 26px/1.1 var(--display); text-wrap: balance; }
.card p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.field { margin-top: 11px; }
.field > label, .lab { display: block; margin-bottom: 6px; font: 600 12px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.field > label b { color: var(--ink); font-size: 14px; letter-spacing: 0; }
input[type=text] { width: 100%; padding: 8px 11px; font: 500 16px var(--body); color: var(--ink); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 9px; }
.swatches { display: flex; gap: 9px; }
.sw { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid rgba(0, 0, 0, 0.25); }
.sw[aria-pressed=true] { border-color: #fff; box-shadow: 0 0 0 2px var(--panel-solid), 0 0 0 4px #fff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
/* map picker: two rows of cards that scroll sideways */
.lab2 { margin-top: 10px; }
.hint { margin: 6px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
.maprow { display: flex; gap: 8px; margin: 0 -16px; padding: 2px 16px 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; }
.mapc {
  flex: none; width: 112px; padding: 0 0 6px; text-align: left; scroll-snap-align: center; overflow: hidden;
  background: rgba(255, 255, 255, 0.06); border: 2px solid var(--line); border-radius: 10px;
}
.mapc canvas { display: block; width: 100%; height: auto; aspect-ratio: 132 / 84; }
.mapc b { display: block; padding: 5px 7px 0; font: 600 15px/1.1 var(--display); }
.mapc small { display: block; padding: 1px 7px 0; font-size: 11px; line-height: 1.2; color: var(--muted); }
.mapc[aria-pressed=true] { border-color: var(--accent); background: rgba(244, 183, 64, 0.14); }
.mapc[aria-pressed=true] b { color: var(--accent); }
kbd {
  display: inline-block; min-width: 20px; padding: 1px 5px; font: 600 12px var(--display); text-align: center; color: var(--ink);
  background: rgba(255, 255, 255, 0.1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
}
.item { position: relative; }
.item > kbd { position: absolute; left: 5px; top: 5px; display: none; }
.card .h3 { margin-top: 16px; font-size: 20px; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; font-size: 13px; }
.keys span { display: flex; align-items: center; gap: 4px; }
.keys kbd:last-of-type { margin-right: 4px; }
@media (hover: hover) and (pointer: fine) { .item > kbd { display: block; } }
.chipb { padding: 6px 11px; font-size: 14px; background: rgba(255, 255, 255, 0.07); border: 1px solid var(--line); border-radius: 999px; }
.chipb[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { padding: 9px 2px; font-size: 13.5px; background: rgba(255, 255, 255, 0.05); border: 0; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 14px; }
.check.wide { margin-top: 12px; }
#bSound[aria-pressed=false] { color: var(--muted); }
body.placing #cv { cursor: crosshair; }
.item.poor .price { color: #ff8a80; background: rgba(224, 42, 32, 0.16); }
/* build bar: desktop only, next to the troop panel */
#hotbar { display: none; }
@media (min-width: 1160px) and (hover: hover) and (pointer: fine) {
  #hotbar:not([hidden]) { position: absolute; left: 448px; bottom: 8px; display: flex; gap: 4px; padding: 5px; pointer-events: auto; }
  #app #toast { bottom: 84px; }
}
.hk {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; width: 54px; padding: 15px 0 4px;
  color: var(--ink); background: rgba(255, 255, 255, 0.05); border: 1.5px solid transparent; border-radius: 9px; cursor: pointer;
}
.hk:hover { background: rgba(255, 255, 255, 0.11); }
.hk[aria-pressed=true] { border-color: var(--accent); background: rgba(244, 183, 64, 0.16); }
.hk kbd { position: absolute; left: 3px; top: 3px; min-width: 16px; padding: 0 3px; font-size: 10.5px; line-height: 13px; border-bottom-width: 1px; }
.hk .own { position: absolute; right: 4px; top: 3px; font: 700 10.5px var(--display); font-style: normal; color: var(--muted); }
.hk span { font: 700 11.5px var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
.hk.poor span { color: #ff8a80; }
.hk.poor svg { opacity: 0.5; }
.check input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent); }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 14px; padding: 12px; border: 0; border-radius: 11px;
  font: 700 20px var(--display); letter-spacing: .03em; color: var(--accent-ink);
  background: linear-gradient(180deg, #ffcc66, var(--accent)); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 2px 8px rgba(0, 0, 0, 0.25);
  transition: transform .08s, filter .12s;
}
.btn:active:not(:disabled) { transform: translateY(1px) scale(.985); filter: brightness(.95); }
.btn.alt { margin-top: 8px; color: #06131f; background: linear-gradient(180deg, #8cc8ff, #5aa9ef); }
.btn.ghost { margin-top: 8px; padding: 10px; font-size: 16px; font-weight: 600; color: var(--ink); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); box-shadow: none; }
.btn.danger { margin-top: 8px; padding: 10px; font-size: 16px; color: #2b0704; background: linear-gradient(180deg, #ff8a7e, var(--bad)); }
.btn:disabled { opacity: .45; }
.code { font-family: var(--display); letter-spacing: .14em; color: var(--accent); }
.linkrow { display: flex; gap: 6px; margin-top: 10px; }
.linkrow input { flex: 1; min-width: 0; font-size: 13px; }
.linkrow .tb { width: 42px; height: auto; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); }
.lab.top { margin-top: 14px; }
.plist { display: grid; gap: 4px; }
.plist div { display: flex; align-items: center; padding: 7px 10px; font-size: 15px; background: rgba(255, 255, 255, 0.06); border-radius: 9px; }
.plist i { margin-left: 8px; padding: 1px 7px; font: 600 11px var(--display); font-style: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; }
.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  Game.prototype.requestAlliance = function (a, b) {
    if (!this.canRequestAlliance(a, b)) return false;
    const r = { id: ++this.uid, from: a, to: b, until: this.ticks + 200, decideAt: this.ticks + this.rng.int(10, 30) };
    this.requests.push(r);
    a.reqCd.set(b.id, this.ticks + 300);
    if (b === this.human) this.emit({ k: 'allyReq', id: r.id, from: a.id, until: r.until });
    return true;
  };
  Game.prototype.answerRequest = function (id, accept) {
    const i = this.requests.findIndex(function (r) { return r.id === id; });
    if (i < 0) return;
    const r = this.requests[i];
    this.requests.splice(i, 1);
    if (accept && r.from.alive && r.to.alive) {
      this.makeAlliance(r.from, r.to);
    } else if (r.from === this.human) {
      this.say(r.to.name + ' lehnt deine Allianz ab', 'warn');
    }
  };
  Game.prototype.makeAlliance = function (a, b) {
    if (a.allies.has(b.id)) return;
    const al = { a: a, b: b, end: this.ticks + ALLIANCE_TICKS, prompted: false };
    a.allies.set(b.id, al); b.allies.set(a.id, al);
    for (const at of a.out.slice()) if (at.tid === b.id) this.endAttack(at, true);
    for (const at of b.out.slice()) if (at.tid === a.id) this.endAttack(at, true);
    this.relate(a, b, 100); this.relate(b, a, 100);
    if (a === this.human || b === this.human) {
      this.say('Allianz mit ' + (a === this.human ? b : a).name + ' geschlossen', 'good');
    }
  };
  Game.prototype.breakAlliance = function (a, b) {
    if (!a.allies.has(b.id)) return false;
    a.allies.delete(b.id); b.allies.delete(a.id);
    if (!this.isTraitor(b)) { a.traitorUntil = this.ticks + TRAITOR_TICKS; a.betrayals++; }
    this.relate(b, a, -100);
    for (let i = 1; i < this.players.length; i++) {
      const q = this.players[i];
      if (q !== a && q !== b && q.alive) this.relate(q, a, -40);
    }
    if (b.type !== PT.HUMAN) b.embargo.add(a.id);
    if (b === this.human) this.say(a.name + ' hat die Allianz mit dir gebrochen!', 'bad');
    else if (a === this.human) this.say('Du hast ' + b.name + ' verraten. 30 Sekunden lang bist du leichter anzugreifen.', 'warn');
    return true;
  };
  Game.prototype.renewAlliance = function (a, b) {
    const al = a.allies.get(b.id);
    if (!al) return false;
    const ok = b.type === PT.HUMAN || (b.ai && b.ai.decide(a, true));
    if (ok) { al.end = this.ticks + ALLIANCE_TICKS; al.prompted = false; }
    if (a === this.human) this.say(ok ? 'Allianz mit ' + b.name + ' verlängert' : b.name + ' will die Allianz nicht verlängern', ok ? 'good' : 'warn');
    return ok;
  };
  Game.prototype.donate = function (a, b, kind, amount) {
    if (!a.alive || !b.alive || !a.allies.has(b.id) || amount < 1) return false;
    if (kind === 'gold') { amount = Math.min(amount, a.gold); a.gold -= amount; b.gold += amount; }
    else { amount = Math.min(amount, a.troops); a.troops -= amount; b.troops += amount; }
    this.relate(b, a, 50);
    if (b === this.human) this.say(a.name + ' schickt dir ' + (kind === 'gold' ? fmt(amount) + ' Gold' : G.fmtTroops(amount) + ' Truppen'), 'good');
    return amount;
  };

  Game.prototype.tickDiplomacy = function () {
    const T = this.ticks, ps = this.players, h = this.human;
    for (let i = 1; i < ps.length; i++) {
      const p = ps[i];
      if (!p.alive) continue;
      if (p.rel) {
        for (const e of p.rel) {
          const v = e[1] > 0 ? e[1] - 0.5 : e[1] + 0.5;
          if (Math.abs(v) < 0.5) p.rel.delete(e[0]); else p.rel.set(e[0], v);
        }
      }
      for (const e of p.allies) {
        if (p.id > e[0]) continue;
        const al = e[1], q = ps[e[0]];
        if (T >= al.end) {
          p.allies.delete(q.id); q.allies.delete(p.id);
          if (p === h || q === h) this.say('Die Allianz mit ' + (p === h ? q : p).name + ' ist abgelaufen', 'warn');
        } else if (!al.prompted && al.end - T <= 300 && (p === h || q === h)) {
          al.prompted = true;
          this.emit({ k: 'renew', id: (p === h ? q : p).id, until: al.end });
        }
      }
    }
    for (const r of this.requests.slice()) {
      if (!r.from.alive || !r.to.alive) { this.answerRequest(r.id, false); continue; }
      if (r.to.type !== PT.HUMAN) {
        if (T >= r.decideAt) this.answerRequest(r.id, r.to.ai ? r.to.ai.decide(r.from, false) : false);
      } else if (T >= r.until) {
        this.answerRequest(r.id, false);
      }
    }
  };

  // ---------- neighbours ----------
  Game.prototype.neighbors = function (p) {
    const own = this.owner, land = this.map.land, W = this.W, H = this.H, id = p.id;
    const ids = new Set();
    let tn = false;
    for (const t of p.border) {
      const x = t % W, y = (t - x) / W;
      if (x > 0) { const n = t - 1, o = own[n]; if (o !== id) { if (o) ids.add(o); else if (land[n]) tn = true; } }
      if (x < W - 1) { const n = t + 1, o = own[n]; if (o !== id) { if (o) ids.add(o); else if (land[n]) tn = true; } }
      if (y > 0) { const n = t - W, o = own[n]; if (o !== id) { if (o) ids.add(o); else if (land[n]) tn = true; } }
      if (y < H - 1) { const n = t + W, o = own[n]; if (o !== id) { if (o) ids.add(o); else if (land[n]) tn = true; } }
    }
    return { tn: tn, ids: ids };
  };
  Game.prototype.sharesBorder = function (p, tid) {
    const own = this.owner, land = this.map.land, W = this.W, H = this.H;
    for (const t of p.border) {
      const x = t % W, y = (t - x) / W;
      if (x > 0 && own[t - 1] === tid && land[t - 1]) return true;
      if (x < W - 1 && own[t + 1] === tid && land[t + 1]) return true;
      if (y > 0 && own[t - W] === tid && land[t - W]) return true;
      if (y < H - 1 && own[t + W] === tid && land[t + W]) return true;
    }
    return false;
  };
  // Is this free tile part of open land that touches the player's territory?
  Game.prototype.tnTouches = function (p, tile) {
    const own = this.owner, land = this.map.land, W = this.W, H = this.H, id = p.id, lim = this.R.tnSearch;
    const st = this.stamp, sid = ++this.sid, q = this.q;
    const tx = tile % W, ty = (tile / W) | 0;
    let qh = 0, qt = 0;
    q[qt++] = tile; st[tile] = sid;
    while (qh < qt) {
      const t = q[qh++], x = t % W, y = (t - x) / W;
      for (let k = 0; k < 4; k++) {
        let n;
        if (k === 0) { if (x === 0) continue; n = t - 1; }
        else if (k === 1) { if (x === W - 1) continue; n = t + 1; }
        else if (k === 2) { if (y === 0) continue; n = t - W; }
        else { if (y === H - 1) continue; n = t + W; }
        const o = own[n];
        if (o === id) return true;
        if (o === 0 && land[n] && st[n] !== sid) {
          const nx = n % W, ny = (n - nx) / W;
          if (Math.abs(nx - tx) + Math.abs(ny - ty) <= lim) { st[n] = sid; q[qt++] = n; }
        }
      }
    }
    return false;
  };

  // ---------- land attacks ----------
  function Attack(id, a, tid, troops, t) {
    this.id = id; this.a = a; this.tid = tid; this.troops = troops;
    this.heap = new G.Heap(128); this.front = new Set(); this.active = true; this.start = t;
  }

  Game.prototype.addFront = function (at, tile) {
    const own = this.owner, land = this.map.land, mg = this.map.mag, W = this.W, H = this.H;
    const tid = at.tid, aid = at.a.id, rng = this.rng, T = this.ticks;
    const x = tile % W, y = (tile - x) / W;
    for (let k = 0; k < 4; k++) {
      let n;
      if (k === 0) { if (x === 0) continue; n = tile - 1; }
      else if (k === 1) { if (x === W - 1) continue; n = tile + 1; }
      else if (k === 2) { if (y === 0) continue; n = tile - W; }
      else { if (y === H - 1) continue; n = tile + W; }
      if (!land[n] || own[n] !== tid) continue;
      at.front.add(n);
      const nx = n % W, ny = (n - nx) / W;
      let mine = 0;
      if (nx > 0 && own[n - 1] === aid) mine++;
      if (nx < W - 1 && own[n + 1] === aid) mine++;
      if (ny > 0 && own[n - W] === aid) mine++;
      if (ny < H - 1 && own[n + W] === aid) mine++;
      if (mine > 2) mine = 10;
      const m = mg[n], rough = m < 10 ? 1 : m < 20 ? 1.5 : 2;
      at.heap.push((rng.int(0, 7) + 10) * (1 - mine * 0.5 + rough / 2) + T, n);
    }
  };
  Game.prototype.refreshFront = function (at) {
    at.heap.clear(); at.front.clear();
    for (const b of at.a.border) this.addFront(at, b);
  };

  // Send troops against a player (tid) or against free land (tid 0). src is a landing tile, or -1.
  Game.prototype.attack = function (a, tid, troops, src) {
    if (!a.alive || this.phase !== 'play') return null;
    const t = tid ? this.players[tid] : null;
    if (t) {
      if (t === a || !t.alive || this.friendly(a, t)) return null;
      if (this.ticks < this.immuneUntil) return null;
    }
    troops = Math.min(troops, a.troops);
    if (troops < 1) return null;
    a.troops -= troops;
    if (t) {
      for (const inc of a.inc.slice()) {
        if (!inc.active || inc.a !== t) continue;
        if (inc.troops > troops) { inc.troops -= troops; return null; }
        troops -= inc.troops;
        this.endAttack(inc, false);
      }
      if (troops < 1) return null;
      this.relate(t, a, -80);
    }
    let at = null;
    for (const o of a.out) if (o.active && o.tid === tid) { at = o; break; }
    if (at) {
      at.troops += troops;
      if (src >= 0) this.addFront(at, src);
      return at;
    }
    at = new Attack(++this.attackSeq, a, tid, troops, this.ticks);
    a.out.push(at);
    if (t) {
      t.inc.push(at);
      if (t === this.human && this.ticks - (a.warnAt || -999) > 300) { a.warnAt = this.ticks; this.say(a.name + ' greift dich an', 'bad'); }
    }
    this.attacks.push(at);
    if (src >= 0) this.addFront(at, src); else this.refreshFront(at);
    return at;
  };

  Game.prototype.endAttack = function (at, refund) {
    if (!at.active) return;
    at.active = false;
    if (refund && at.a.alive && at.troops > 0) at.a.troops += at.troops;
    let i = at.a.out.indexOf(at);
    if (i >= 0) at.a.out.splice(i, 1);
    if (at.tid) {
      const t = this.players[at.tid];
      i = t.inc.indexOf(at);
      if (i >= 0) t.inc.splice(i, 1);
    }
  };
  // Calling troops back costs a quarter of them.
  Game.prototype.retreat = function (at) {
    if (!at.active) return;
    at.troops *= 0.75;
    this.endAttack(at, true);
  };

  Game.prototype.tickAttack = function (at) {
    const a = at.a, tid = at.tid, t = tid ? this.players[tid] : null;
    if (!a.alive) { this.endAttack(at, false); return; }
    if (t && (!t.alive || this.friendly(a, t))) { this.endAttack(at, true); return; }
    if (at.troops < 1) { this.endAttack(at, false); return; }
    const own = this.owner, map = this.map, mg = map.mag, W = this.W, H = this.H, aid = a.id;
    const n = at.front.size + this.rng.int(0, 5);
    let budget = t ? within((5 * at.troops / Math.max(1, t.troops)) * 2, 0.01, 0.5) * n * 3 : n * (a.type === PT.BOT ? 1.4 : 2);
    const landTiles = map.landTiles;
    const lossMod = a.tiles > landTiles * 0.17 ? Math.sqrt(landTiles * 0.17 / a.tiles) : 1;
    const speedMod = a.tiles > landTiles * 0.13 ? Math.pow(landTiles * 0.13 / a.tiles, 0.6) : 1;
    const traitor = t && t.traitorUntil > this.ticks ? 0.5 : 1;
    const easy = !!t && t.type === PT.BOT && a.type !== PT.BOT, botMod = easy ? 0.35 : 1;   // bots barely defend themselves
    const dp = t ? t.dposts : null, dr2 = this.R.defense * this.R.defense, fo = this.fallout;
    let guard = 0;
    while (budget > 0) {
      if (at.troops < 1) { this.endAttack(at, false); return; }
      if (at.heap.n === 0) {
        this.refreshFront(at);
        if (at.heap.n === 0) { this.endAttack(at, true); return; }
      }
      if (++guard > 100000) return;
      const tile = at.heap.pop();
      at.front.delete(tile);
      if (own[tile] !== tid) continue;
      const x = tile % W, y = (tile - x) / W;
      if (!((x > 0 && own[tile - 1] === aid) || (x < W - 1 && own[tile + 1] === aid) ||
            (y > 0 && own[tile - W] === aid) || (y < H - 1 && own[tile + W] === aid))) continue;
      this.addFront(at, tile);
      const m = mg[tile];
      let mag = m < 10 ? 80 : m < 20 ? 100 : 120, speed = m < 10 ? 16.5 : m < 20 ? 20 : 25;
      if (dp && dp.length) {
        for (let i = 0; i < dp.length; i++) {
          const dx = dp[i].x - x, dy = dp[i].y - y;
          if (dx * dx + dy * dy <= dr2) { mag *= 3 + 2 * dp[i].level; speed *= 1 + 2 * dp[i].level; break; }   // level 1: losses x5, speed cost x3
        }
      }
      if (fo[tile]) { const f = 5 - 2 * this.falloutCount / landTiles; mag *= f; speed *= f; }
      let loss, used;
      if (t) {
        const tt = t.troops;
        loss = within(tt / at.troops, 0.6, 2) * mag * 0.8 * botMod * lossMod * traitor;
        used = within(tt / (5 * at.troops), 0.2, 1.5) * speed * speedMod * (easy ? 0.45 : 1);

    }

  // Whoever takes a player over gets its gold; a bot pays a bounty on top.
  // On top comes a reward by size: so much gold for every tile the conquered realm held at its largest.
  G.BOT_BOUNTY = 25000;
  G.LAND_GOLD = 60;
  Game.prototype.bounty = function (t) {

  };
  Game.prototype.loot = function (a, t) {
    // a conquered person keeps half of the gold out of the victor's hands, bots and nations lose all of it

    t.gold = 0; a.gold += gold; a.conquests++;

    return gold;
  };
  // A player reduced to a sliver of land is absorbed whole, gold included.
  Game.prototype.finishOff = function (a, t) {
    const gold = this.loot(a, t);
    if (a === this.human) this.say(t.name + ' erobert, ' + fmt(gold) + ' Gold erbeutet', 'good');
    this.forTiles(t, (x) => this.conquer(a, x));
  };

  // ---------- cut-off pockets ----------
  Game.prototype.removeClusters = function (p) {
    const W = this.W, H = this.H, own = this.owner, id = p.id, st = this.stamp, sid = ++this.sid;
    const border = p.border, clusters = [];
    for (const start of border) {
      if (st[start] === sid) continue;
      const cl = [start];
      st[start] = sid;
      for (let i = 0; i < cl.length; i++) {
        const t = cl[i], x = t % W, y = (t - x) / W;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = y + dy;
          if (yy < 0 || yy >= H) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = x + dx;
            if (xx < 0 || xx >= W || (!dx && !dy)) continue;
            const n = yy * W + xx;
            if (st[n] !== sid && own[n] === id && border.has(n)) { st[n] = sid; cl.push(n); }
          }
        }
      }
      clusters.push(cl);
    }
    if (!clusters.length) return;
    let mi = 0;
    for (let i = 1; i < clusters.length; i++) if (clusters[i].length > clusters[mi].length) mi = i;
    for (let i = 0; i < clusters.length; i++) {
      if (p.tiles <= 0) return;
      if (i === mi ? this.enclosed(p, clusters[i]) : this.surrounded(p, clusters[i])) this.capturePocket(p, clusters[i]);
    }
  };
  // Every neighbour of the main body belongs to one single other player.
  Game.prototype.enclosed = function (p, cl) {
    const W = this.W, H = this.H, own = this.owner, id = p.id;
    let enemy = 0;
    for (let i = 0; i < cl.length; i++) {
      const t = cl[i], x = t % W, y = (t - x) / W;
      if (x === 0 || y === 0 || x === W - 1 || y === H - 1) return false;
      for (let k = 0; k < 4; k++) {
        const o = own[k === 0 ? t - 1 : k === 1 ? t + 1 : k === 2 ? t - W : t + W];
        if (o === id) continue;
        if (!o) return false;

      }
    }
    return enemy > 0 && !this.friendly(p, this.players[enemy]);

  // A detached piece that sits inland and inside the reach of the players around it.
  Game.prototype.surrounded = function (p, cl) {
    const W = this.W, H = this.H, own = this.owner, id = p.id, shore = this.map.shore;
    let cx0 = W, cx1 = -1, cy0 = H, cy1 = -1, ex0 = W, ex1 = -1, ey0 = H, ey1 = -1;
    for (let i = 0; i < cl.length; i++) {
      const t = cl[i], x = t % W, y = (t - x) / W;
      if (shore[t] || x === 0 || y === 0 || x === W - 1 || y === H - 1) return false;
      if (x < cx0) cx0 = x;
      if (x > cx1) cx1 = x;
      if (y < cy0) cy0 = y;
      if (y > cy1) cy1 = y;
      for (let k = 0; k < 4; k++) {
        const nx = k === 0 ? x - 1 : k === 1 ? x + 1 : x, ny = k === 2 ? y - 1 : k === 3 ? y + 1 : y;
        const o = own[ny * W + nx];
        if (!o || o === id) continue;
        if (nx < ex0) ex0 = nx;
        if (nx > ex1) ex1 = nx;
        if (ny < ey0) ey0 = ny;
        if (ny > ey1) ey1 = ny;
      }
    }
    return ex1 >= 0 && ex0 <= cx0 && ey0 <= cy0 && ex1 >= cx1 && ey1 >= cy1;
  };
  Game.prototype.capturePocket = function (p, cl) {
    const W = this.W, H = this.H, own = this.owner, id = p.id;
    const count = new Map();
    for (let i = 0; i < cl.length; i++) {
      const t = cl[i], x = t % W, y = (t - x) / W;
      if (own[t] !== id) return;
      for (let k = 0; k < 4; k++) {
        const nx = k === 0 ? x - 1 : k === 1 ? x + 1 : x, ny = k === 2 ? y - 1 : k === 3 ? y + 1 : y;

    }
    let taker = null, best = 0;
    for (const e of count) {
      const q = this.players[e[0]];
      if (this.friendly(p, q)) continue;
      for (const at of q.out) if (at.active && at.tid === id && at.troops > best) { best = at.troops; taker = q; }
    }
    if (!taker) {
      best = 0;
      for (const e of count) {
        const q = this.players[e[0]];
        if (!this.friendly(p, q) && e[1] > best) { best = e[1]; taker = q; }
      }
    }
    if (!taker) return;
    const st = this.stamp, sid = ++this.sid, q = this.q;
    let qh = 0, qt = 0;
    q[qt++] = cl[0]; st[cl[0]] = sid;
    while (qh < qt) {
      const t = q[qh++], x = t % W, y = (t - x) / W;
      if (x > 0 && own[t - 1] === id && st[t - 1] !== sid) { st[t - 1] = sid; q[qt++] = t - 1; }
      if (x < W - 1 && own[t + 1] === id && st[t + 1] !== sid) { st[t + 1] = sid; q[qt++] = t + 1; }
      if (y > 0 && own[t - W] === id && st[t - W] !== sid) { st[t - W] = sid; q[qt++] = t - W; }
      if (y < H - 1 && own[t + W] === id && st[t + W] !== sid) { st[t + W] = sid; q[qt++] = t + W; }
    }
    if (qt === p.tiles) {
      const gold = this.loot(taker, p);
      if (taker === this.human) this.say(p.name + ' eingekreist und übernommen, ' + fmt(gold) + ' Gold erbeutet', 'good');
    }
    const list = q.slice(0, qt);
    for (let i = 0; i < list.length; i++) this.conquer(taker, list[i]);
  };

  // ---------- deaths and victory ----------
  Game.prototype.kill = function (p) {
    p.alive = false; p.troops = 0;
    for (const a of p.out.slice()) this.endAttack(a, false);
    for (const a of p.inc.slice()) this.endAttack(a, true);
    for (const u of p.units.slice()) if (u.type < UT.ATOM) this.removeUnit(u);

  // Small pictures of every map for the picker.
  const THUMB = [[38, 88, 140], [150, 200, 116], [196, 184, 138], [228, 230, 236]];
  function paintThumb(cv, cls, w, h) {
    const x = cv.getContext('2d'), tmp = document.createElement('canvas');
    tmp.width = w; tmp.height = h;
    const tx = tmp.getContext('2d'), img = tx.createImageData(w, h), d = img.data;
    for (let i = 0; i < w * h; i++) {
      const c = THUMB[cls[i]];
      d[i * 4] = c[0]; d[i * 4 + 1] = c[1]; d[i * 4 + 2] = c[2]; d[i * 4 + 3] = 255;
    }
    tx.putImageData(img, 0, 0);
    x.fillStyle = 'rgb(38,88,140)'; x.fillRect(0, 0, cv.width, cv.height);
    const k = Math.min(cv.width / w, cv.height / h);
    x.imageSmoothingEnabled = true;
    x.drawImage(tmp, (cv.width - w * k) / 2, (cv.height - h * k) / 2, w * k, h * k);
  }
  function drawThumbs() {
    for (const cv of document.querySelectorAll('canvas[data-thumb]')) {
      const id = cv.dataset.thumb, sp = special(id);
      if (id === 'zufall') {
        const x = cv.getContext('2d');
        x.fillStyle = 'rgb(38,88,140)'; x.fillRect(0, 0, cv.width, cv.height);
        x.fillStyle = '#f4b740'; x.font = '700 54px ' + getComputedStyle(document.body).fontFamily;
        x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', cv.width / 2, cv.height / 2 + 3);
      } else if (sp) {
        const w = Math.round(sp.w / 6), h = Math.round(sp.h / 6);
        paintThumb(cv, G.randomClassMap(w, h, sp.seed, sp.kind, sp.w), w, h);
      } else {
        const def = MAPS.find(function (m) { return m.id === id; }), img = new Image();
        img.onload = function () {
          const w = Math.round(def.w / 6), h = Math.round(def.h / 6), c = document.createElement('canvas');
          c.width = w; c.height = h;
          const x = c.getContext('2d', { willReadFrequently: true });
          x.drawImage(img, 0, 0, w, h);
          const d = x.getImageData(0, 0, w, h).data, cls = new Uint8Array(w * h);
          for (let i = 0; i < cls.length; i++) cls[i] = Math.round(d[i * 4] / 85);
          paintThumb(cv, cls, w, h);
        };
        img.src = 'data:image/png;base64,' + def.png;
      }
    }
  }

  function helpHtml() {

      '<li><b>Übers Wasser:</b> Tippe auf ein fremdes Ufer und schicke ein <b>Boot</b>. Höchstens drei sind gleichzeitig unterwegs.</li>' +

      '<li><b>Sieg:</b> Wer 80 % des Landes hält, gewinnt.</li>' +
      '<li><b>Bots:</b> Kleine Reiche mit langen Namen. Ihr Land ist grau. Sie bauen nichts, nehmen sich ein Stück freies Land und wehren sich kaum. Angreifen tun sie nur, wer viel weniger Truppen hat als sie selbst, und auch dann nur langsam. Wer eines erobert, bekommt sein Gold und eine Prämie.</li>' +

      '<li><b>Marschflugkörper:</b> Günstig, schnell und genau. Er zerstört Gebäude in einem kleinen Umkreis, hinterlässt kein verstrahltes Land und wird nur selten abgefangen. Gut, um zuerst die Flugabwehr auszuschalten.</li>' +

      '<li><b>Züge:</b> Pro Bahnhof gibt es 10K Gold, bei Handelspartnern 25K für beide, bei Verbündeten 35K für beide. Ab dem zehnten Bahnhof einer Fahrt sinkt der Betrag um 5K pro Halt, aber nie unter 5K.</li>' +

      '<span><kbd>P</kbd>Pause</span><span><kbd>,</kbd><kbd>.</kbd>Tempo −/+</span><span><kbd>Strg</kbd>+ Klick: Baumenü</span><span>Rechtsklick: Kreismenü</span><span><kbd>Shift</kbd>+ Mausrad: Truppenanteil</span>' +
      '<span><kbd>Esc</kbd>Schliessen</span></div><p>Eine Bau-Taste zeigt das Gebäude oder die Bombe zuerst am Mauszeiger: in deiner Farbe, wenn es dort geht, rot, wenn nicht. Fehlt nur das Gold, bleibt der Preis stehen und wird rot; sonst steht der Grund dabei. Ein Klick setzt es, mit gedrückter <kbd>Shift</kbd>-Taste mehrere hintereinander. Klickst du damit auf ein eigenes Gebäude derselben Art, wird es um eine Stufe ausgebaut; dieselbe Taste, <kbd>Esc</kbd> oder ein Rechtsklick legt es wieder weg.</p><p>Zusätzlich, weil es das in OpenFront nicht gibt: <kbd>U</kbd> baut das Gebäude unter dem Mauszeiger aus, <kbd>Shift</kbd> + <kbd>1</kbd>–<kbd>6</kbd> das nächste Gebäude dieser Art, <kbd>Enter</kbd> feuert im Zielmodus des Baumenüs die Bombe ab, <kbd>M</kbd> schaltet den Ton, die Leertaste pausiert ebenfalls.</p><p>' +
      'Befehle gelten für die Stelle unter dem Mauszeiger.</p>';

  function showHelp(fromStart) {
    openModal(helpHtml() + '<button class="btn" data-act="' + (fromStart ? 'start' : 'resume') + '" type="button">' + (fromStart ? 'Zurück' : 'Weiterspielen') + '</button>', fromStart ? 'starthelp' : 'help');
  }

  function startGame() {
    readForm();
    $('fStart').disabled = true; $('fStart').textContent = 'Karte wird vorbereitet';
    loadMap(cfg.map).then(function (map) {
      begin(map, {
        seed: (Math.random() * 2e9) | 0, difficulty: cfg.diff, bots: cfg.bots, nations: cfg.nations, arsenal: cfg.mode === 'arsenal',
        instantBuild: cfg.instant, infiniteGold: cfg.gold, infiniteTroops: cfg.troops
      }, { name: cfg.name, color: COLORS[cfg.color] });
    }).catch(function (e) {
      toast(e.message);
      $('fStart').disabled = false; $('fStart').textContent = 'Spiel starten';
    });
  }
  function begin(map, opts, people) {
    game = new G.Game(map, opts);
    game.setup(people);
    view.setMap(map); view.setGame(game); view.fit(false);
    view.cam.z = within(Math.max(view.cw / map.W, view.ch / map.H) * 0.5, view.cam.z, 4);
    $('modal').hidden = true; modalKind = '';
    $('hud').hidden = false; $('spawnBar').hidden = false; $('ctrl').hidden = true; $('lb').hidden = true; $('aimBar').hidden = true;
    $('feedMsgs').innerHTML = ''; $('feedLive').innerHTML = ''; chips.clear(); asks.clear();
    $('lbRows').innerHTML = ''; $('clock').textContent = '0:00';
    speed = 1; $('bSpeed').textContent = '1×'; acc = 0; endShown = false; lbAt = liveAt = -99; tradeAt = 0; aim = null;
    setPaused(false);
    view.placeNames();
    hudTick();
  }
  // Every order of the player goes through here: carried out at once when playing alone,
  // sent to the host when playing together.
  function act(c) {
    if (!game) return;
    if (mp) mp.send(c);
    else done(c, game.exec(game.human.id, c));
  }
  function done(c, why) {
    if (why) { toast(why); snd('deny'); return; }
    if (c.k === 'strike') snd(c.sea ? 'boat' : 'attack');
    else if (c.k === 'build') { if (c.u === UT.WARSHIP) snd('ship'); else if (c.u < UT.ATOM) snd('build'); }
    else if (c.k === 'up') snd('upgrade');
    else if (c.k === 'ship') snd('ship');
    else if (c.k === 'spawn') snd('tap');
    if (c.k === 'spawn') { view.flush(); view.placeName(game.human); hudTick(); }
    else if (c.say) toast(c.say);
    if (modalKind === 'info') renderInfo();
  }
  function applyTurn(list) {
    const me = game.human ? game.human.id : 0;
    for (let i = 0; i < list.length; i++) {
      const id = list[i][0] | 0, c = list[i][1], why = game.exec(id, c);
      if (id === me) done(c, why);
    }
  }
  function quitGame() {
    game = null; closeRadial(); $('sheet').hidden = true; stopAim();
    $('hud').hidden = true;
    leaveRoom();
    if (cfg.map === 'zufall') delete maps.zufall;
    showStart();
    previewMap(cfg.map);
  }

  // ---------- feed ----------
  function addMsg(text, cls) {
    const box = $('feedMsgs'), el = document.createElement('div');
    el.className = 'msg ' + (cls || 'info');
    el.textContent = text;
    box.appendChild(el);
    while (box.querySelectorAll('.msg:not(.ask)').length > 4) box.querySelector('.msg:not(.ask)').remove();
    setTimeout(function () { el.remove(); }, 7000);
  }
  function addAsk(key, text, yes, no, onYes, onNo) {
    if (asks.has(key)) return;
    const el = document.createElement('div');
    el.className = 'msg ask';
    el.innerHTML = '<span>' + esc(text) + '</span><div><button type="button" class="yes">' + yes + '</button>' + (no ? '<button type="button" class="no">' + no + '</button>' : '') + '</div>';
    el.querySelector('.yes').addEventListener('click', function () { dropAsk(key); onYes(); });
    if (no) el.querySelector('.no').addEventListener('click', function () { dropAsk(key); onNo(); });
    $('feedMsgs').appendChild(el);
    asks.set(key, el);
  }
  function dropAsk(key) {
    const el = asks.get(key);
    if (el) { el.remove(); asks.delete(key); }
  }
  function pump() {
    const ev = game.events, h = game.human;
    if (!ev.length) return;
    for (let i = 0; i < ev.length; i++) {
      const e = ev[i];
      if (e.k === 'msg') {
        addMsg(e.text, e.cls);
        if (e.cls === 'bad') snd('bad', 0.6); else if (e.cls === 'warn') snd('warn', 0.6); else if (e.cls === 'good') snd(/Allianz/.test(e.text) ? 'ally' : 'good', 0.4);
      }
      else if (e.k === 'allyReq') {
        const from = game.players[e.from], id = e.id;
        addAsk('q' + id, from.name + ' bietet dir eine Allianz an', 'Annehmen', 'Ablehnen',
          function () { act({ k: 'ans', id: id, y: 1 }); }, function () { act({ k: 'ans', id: id, y: 0 }); });
      } else if (e.k === 'renew') {
        const q = game.players[e.id];
        addAsk('r' + q.id, 'Die Allianz mit ' + q.name + ' läuft bald ab', 'Verlängern', 'Auslaufen lassen',
          function () { act({ k: 'renew', p: q.id }); }, function () { /* let it run out */ });
      } else if (e.k === 'start') {
        $('spawnBar').hidden = true; $('ctrl').hidden = false; $('lb').hidden = false;
        const W = game.W;
        view.flyTo(h.spawnTile % W, (h.spawnTile / W) | 0, within(Math.min(view.cw, view.ch) / 70, 2.2, 6));
        addMsg('Los geht es. Breite dich aus, bevor es andere tun.', 'good');
        snd('start');
      } else if (e.k === 'loot') {
        if (e.by === h.id && e.gold > 0) { view.floatText(e.x, e.y, '+ ' + fmt(e.gold)); goldPop(e.gold); }
      } else if (e.k === 'defeat') showEnd('defeat', null);
      else if (e.k === 'win') showEnd(game.players[e.id] === h ? 'win' : 'other', game.players[e.id]);
    }
    ev.length = 0;
  }

  // Show a sum of gold that just came in, right next to the gold counter.
  function goldPop(n) {
    const el = $('goldPop');
    el.textContent = '+' + fmt(n);
    el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    $('statGold').classList.add('flash');
    clearTimeout(goldTimer);
    goldTimer = setTimeout(function () { $('statGold').classList.remove('flash'); }, 1300);
  }

  function live() {
    const h = game.human, seen = new Set(), box = $('feedLive');
    const put = function (key, cls, text, action) {
      seen.add(key);
      let el = chips.get(key);
      if (!el) {
        el = document.createElement('div');
        el.className = 'msg chip ' + cls;
        el.innerHTML = '<span></span>' + (action ? '<button type="button" aria-label="Zurückrufen">' + svg('close', 13) + '</button>' : '');
        if (action) el.lastChild.addEventListener('click', action);
        box.appendChild(el);
        chips.set(key, el);
      }
      if (el.firstChild.textContent !== text) el.firstChild.textContent = text;
    };
    if (h.alive) {
      for (const a of h.out) {
        put('o' + a.id, 'info', 'Angriff auf ' + (a.tid ? game.players[a.tid].name : 'freies Land') + ' · ' + fmtT(a.troops), function () { act({ k: 'ret', a: a.id }); });
      }
      const inc = h.inc.slice().sort(function (a, b) { return b.troops - a.troops; });
      for (let i = 0; i < inc.length && i < 3; i++) put('i' + inc[i].id, 'bad', inc[i].a.name + ' greift an · ' + fmtT(inc[i].troops), null);
      if (inc.length > 3) put('more', 'bad', '+' + (inc.length - 3) + ' weitere Angriffe', null);
      for (const u of h.units) {
        if (u.type !== UT.TRANSPORT) continue;
        put('b' + u.id, 'info', (u.retreat ? 'Boot kehrt um · ' : 'Boot unterwegs · ') + fmtT(u.troops), function () { act({ k: 'bret', u: u.id }); });
      }
    }
    for (const e of chips) if (!seen.has(e[0])) { e[1].remove(); chips.delete(e[0]); }
    for (const e of asks) {
      const key = e[0];
      if (key[0] === 'q') {
        const id = +key.slice(1);
        if (!game.requests.some(function (r) { return r.id === id; })) dropAsk(key);
      } else {
        const al = h.allies.get(+key.slice(1));
        if (!al || !al.prompted) dropAsk(key);
      }
    }
  }

  function leaderboard() {
    const h = game.human, den = Math.max(1, game.map.landTiles - game.falloutCount);
    const ps = game.players.filter(function (p) { return p && p.alive; }).sort(function (a, b) { return b.tiles - a.tiles; });
    const n = lbOpen ? 10 : (view.cw < 700 ? 3 : 5);
    const row = function (p, i) {
      const s = p.tiles / den * 100;
      return '<button class="lbrow' + (p === h ? ' me' : '') + '" data-id="' + p.id + '" type="button"><i>' + (i + 1) + '</i><span><span class="dot" style="background:' + p.css + '"></span>' +
        esc(p.name) + '</span><b>' + s.toFixed(s >= 10 ? 0 : 1) + '%</b><b>' + fmtT(p.troops) + '</b></button>';
    };
    let html = '';
    for (let i = 0; i < n && i < ps.length; i++) html += row(ps[i], i);
    const hi = ps.indexOf(h);
    if (hi >= n) html += row(h, hi);
    $('lbRows').innerHTML = html;
    $('lbCount').textContent = ps.length + ' im Spiel';
  }

  // The build bar at the bottom of a desktop screen, as in OpenFront: every building and weapon with
  // its key, how many you own and its price (red while you cannot pay). A click picks it up.
  let hotSig = '';
  function renderHotbar() {
    const el = $('hotbar'), h = game.human;
    if (!h.alive || game.phase !== 'play') { el.hidden = true; return; }
    el.hidden = false;
    const rich = game.opts.infiniteGold;
    const cells = BUILD.filter(function (b) { return b.t !== UT.LASER || game.opts.arsenal; }).map(function (b) {
      const cost = game.cost(h, b.t), wait = b.t === UT.LASER ? Math.ceil(((h.laserAt || 0) - game.ticks) / 10) : 0;
      const have = b.t === UT.WARSHIP ? h.units.filter(function (u) { return u.type === UT.WARSHIP; }).length : b.t <= UT.FACTORY ? h.units.filter(function (u) { return u.type === b.t; }).length : 0;
      return { b: b, cost: wait > 0 ? wait + ' s' : fmt(cost), poor: wait > 0 || (!rich && h.gold < cost), have: have, on: !!ghost && ghost.t === b.t };
    });
    const sig = cells.map(function (c) { return c.cost + (c.poor ? '!' : '') + c.have + (c.on ? '*' : ''); }).join('|');
    if (sig === hotSig) return;
    hotSig = sig;
    el.innerHTML = cells.map(function (c) {
      return '<button type="button" class="hk' + (c.poor ? ' poor' : '') + '" data-t="' + c.b.t + '" aria-pressed="' + c.on + '" title="' + plain(c.b.t) + ': ' + esc(c.b.note) + '">' +
        '<kbd>' + c.b.key.toUpperCase() + '</kbd>' + (c.have ? '<i class="own">' + c.have + '</i>' : '') + svg(c.b.icon, 22) + '<span>' + c.cost + '</span></button>';
    }).join('');
  }

  function hudTick() {
    const h = game.human, T = game.ticks;
    if (game.phase === 'spawn') {
      if (mp) {
        let n = 0;
        for (const q of game.humans) if (q.spawned) n++;
        $('spawnBarLine').hidden = false;
        $('spawnFill').style.width = (Math.min(1, T / game.spawnEnd) * 100).toFixed(1) + '%';
        $('spawnHint').textContent = h.spawned ? 'Warte auf die anderen · ' + n + ' von ' + game.humans.length + ' bereit'
          : 'Tippe auf freies Land · noch ' + Math.max(0, Math.ceil((game.spawnEnd - T) / 10)) + ' s';
      } else {
        $('spawnBarLine').hidden = true;
        $('spawnHint').textContent = 'Tippe auf freies Land, dann geht es sofort los';
      }
      return;
    }
    $('clock').textContent = clock((T - game.playStart) / 10);
    renderHotbar();
    if (h.alive) {
      $('sTroops').textContent = fmtT(h.troops);
      $('sTroopsSub').textContent = 'von ' + (game.opts.infiniteTroops ? '∞' : fmtT(game.maxTroops(h))) + ' · +' + fmtT(Math.max(0, game.troopGrowth(h)) * 10) + '/s';
      $('sGold').textContent = game.opts.infiniteGold ? '∞' : fmt(h.gold);
      $('sGoldSub').textContent = '+' + fmt(game.goldRate(h) * 10) + '/s';
      $('ratioTroops').textContent = fmtT(h.troops * ratio);
    }
    if (T - lbAt >= 10) { lbAt = T; leaderboard(); }
    if (T - liveAt >= 3) { liveAt = T; live(); }
    if (T - tradeAt >= 150) {
      tradeAt = T;
      if (h.tradeGold > 0) { addMsg('Handel bringt ' + fmt(h.tradeGold) + ' Gold', 'good'); h.tradeGold = 0; }
    }
    if (modalKind === 'info' && T % 5 === 0) renderInfo();
    if (aim && T % 3 === 0) refreshAim();
  }

  // ---------- end of game ----------
  function showEnd(kind, winner) {
    if (kind === 'other' && endShown === 'defeat' && !$('modal').hidden) { /* replace the defeat card */ }
    else if (endShown && kind !== 'other') return;
    endShown = kind;
    snd(kind === 'win' ? 'win' : 'lose');
    closeRadial(); $('sheet').hidden = true;
    const h = game.human, den = Math.max(1, game.map.landTiles - game.falloutCount);
    let s;
    if (kind === 'win') s = '<h2>Sieg!</h2><p>Du hältst ' + (h.tiles / den * 100).toFixed(0) + ' % des Landes. Die Karte gehört dir.</p>';
    else if (kind === 'defeat') s = '<h2>Niederlage</h2><p>Dein Gebiet wurde vollständig erobert.</p>';
    else s = '<h2>' + esc(winner.name) + ' gewinnt</h2><p>' + esc(winner.name) + ' hält ' + (winner.tiles / den * 100).toFixed(0) + ' % des Landes.</p>';
    s += '<div class="facts">' + fact('Spielzeit', clock((game.ticks - game.playStart) / 10)) + fact('Eroberte Gegner', h.conquests) + fact('Dein Gebiet', (h.tiles / den * 100).toFixed(1) + ' %') + '</div>';
    s += '<button class="btn" data-act="quit" type="button">Neues Spiel</button>';
    s += '<button class="btn ghost" data-act="close" type="button">' + (kind === 'win' ? 'Weiterspielen' : 'Zuschauen') + '</button>';
    openModal(s, 'end');
  }

  // ---------- player card ----------
  function fact(label, value) { return '<div><small>' + label + '</small><b>' + value + '</b></div>'; }
  function openInfo(id) { infoId = id; renderInfo(); }
  function renderInfo() {
    const p = game.players[infoId], h = game.human, T = game.ticks;
    const den = Math.max(1, game.map.landTiles - game.falloutCount), me = p === h, al = h.allies.get(p.id);
    let kind;
    if (!p.alive) kind = 'Besiegt';
    else if (me) kind = 'Das bist du';
    else if (p.type === PT.NATION) {
      const r = game.relation(p, h);
      kind = 'Nation · ' + (r < -50 ? 'feindlich' : r < 0 ? 'misstrauisch' : r < 50 ? 'neutral' : 'freundlich') + ' gesinnt';
    } else kind = p.type === PT.HUMAN ? 'Mitspieler' : 'Bot · baut nichts, greift nur viel Schwächere langsam an';
    let s = '<div class="who"><span class="dot big" style="background:' + p.css + '"></span><div><h2>' + (p.flag ? G.flagOf(p.flag) + ' ' : '') + esc(p.name) + '</h2><p>' + kind + '</p></div></div>';
    s += '<div class="facts">' + fact('Truppen', fmtT(p.troops)) + fact('Gold', me && game.opts.infiniteGold ? '∞' : fmt(p.gold)) + fact('Gebiet', (p.tiles / den * 100).toFixed(1) + ' %') + '</div>';
    if (!me && p.alive) s += '<p class="notes">Eroberung bringt ' + fmt(Math.floor(p.type === PT.HUMAN ? p.gold / 2 : p.gold) + game.bounty(p)) + ' Gold (sein Gold und die Prämie für ' + G.fmt(Math.max(p.peak, p.tiles)) + ' Felder).</p>';
    s += '<div class="facts six">' + fact('Städte', p.cnt[UT.CITY]) + fact('Häfen', p.cnt[UT.PORT]) + fact('Fabriken', p.cnt[UT.FACTORY]) +
      fact('Posten', p.cnt[UT.DEFENSE]) + fact('Silos', p.cnt[UT.SILO]) + fact('Abwehr', p.cnt[UT.SAM]) + '</div>';
    const notes = [];
    if (al) notes.push('Verbündet, noch ' + clock((al.end - T) / 10));
    if (p.traitorUntil > T) notes.push('Verräter, noch ' + Math.ceil((p.traitorUntil - T) / 10) + ' s leichter zu erobern');
    if (!me && h.embargo.has(p.id)) notes.push('Du handelst nicht mit diesem Spieler');
    if (!me && p.embargo.has(h.id)) notes.push('Dieser Spieler handelt nicht mit dir');
    if (notes.length) s += '<p class="notes">' + notes.join(' · ') + '</p>';
    if (!me && p.alive && h.alive && game.phase === 'play') {
      if (al) {
        s += '<div class="acts"><button class="btn ghost" data-act="troops" type="button">Truppen spenden (' + fmtT(h.troops * ratio) + ')</button>' +
          '<button class="btn ghost" data-act="gold" type="button">Gold spenden (' + fmt(Math.min(h.gold, 1e9) * 0.1) + ')</button></div>';
        s += '<button class="btn ghost" data-act="renew" type="button">Allianz verlängern</button>';
        s += '<button class="btn danger" data-act="break" type="button">Allianz brechen</button>';
      } else {
        s += '<button class="btn" data-act="ally" type="button"' + (game.canRequestAlliance(h, p) ? '' : ' disabled') + '>Allianz anfragen</button>';
      }
      s += '<button class="btn ghost" data-act="embargo" type="button">' + (h.embargo.has(p.id) ? 'Handel wieder erlauben' : 'Handel stoppen') + '</button>';
    }
    if (p.alive) s += '<button class="btn ghost" data-act="show" type="button">Auf der Karte zeigen</button>';
    s += '<button class="btn ghost" data-act="close" type="button">Schliessen</button>';
    const card = $('modalCard'), top = card.scrollTop;
    card.innerHTML = s;
    $('modal').hidden = false; modalKind = 'info';
    card.scrollTop = top;
  }

  function showMenu() {
    if (!mp) setPaused(true);
    openModal('<h2>' + (mp ? 'Menü' : 'Pause') + '</h2><p>' + esc(game.map.name) + ' · ' + G.DIFF_NAMES[game.opts.difficulty] + (game.opts.arsenal ? ' · Arsenal' : '') + '</p>' +
      '<button class="btn" data-act="resume" type="button">Weiterspielen</button>' +
      '<button class="btn ghost" data-act="help" type="button">So wird gespielt</button>' +
      '<label class="check wide" for="mMusic"><input id="mMusic" type="checkbox"' + (cfg.music ? ' checked' : '') + '>Musik</label>' +
      '<label class="check" for="mSfx"><input id="mSfx" type="checkbox"' + (cfg.sfx ? ' checked' : '') + '>Töne bei Aktionen</label>' +
      '<button class="btn ghost" data-act="quit" type="button">Spiel beenden</button>', 'menu');
    $('mMusic').addEventListener('change', function () { setSound('music', this.checked); });
    $('mSfx').addEventListener('change', function () { setSound('sfx', this.checked); });
  }
  function setSound(kind, v) {
    cfg[kind] = v; saveCfg();
    G.Audio.set(kind, v);
    const any = cfg.music || cfg.sfx;
    $('bSound').innerHTML = svg(any ? 'sound' : 'mute', 18);
    $('bSound').setAttribute('aria-label', any ? 'Ton aus' : 'Ton an');
    $('bSound').setAttribute('aria-pressed', any ? 'true' : 'false');
  }

  function onModalAct(what) {
    const h = game ? game.human : null, p = game ? game.players[infoId] : null;
    if (what === 'start') { showStart(); return; }
    if (what === 'close' || act === 'resume') { closeModal(); return; }
    if (what === 'help') { showHelp(false); return; }
    if (what === 'quit') { quitGame(); return; }
    if (what === 'confirmBreak') { act({ k: 'break', p: p.id }); closeModal(); return; }
    if (what === 'ally') { act({ k: 'ally', p: p.id, say: 'Anfrage an ' + p.name + ' gesendet' }); return; }
    if (what === 'break') {
      openModal('<h2>Allianz brechen?</h2><p>Du wirst zum Verräter: 30 Sekunden lang verlieren Angreifer gegen dich nur halb so viele Truppen, und andere Nationen trauen dir weniger.</p>' +
        '<button class="btn danger" data-act="confirmBreak" type="button">Allianz mit ' + esc(p.name) + ' brechen</button>' +
        '<button class="btn ghost" data-act="close" type="button">Abbrechen</button>', 'confirm');
      return;
    }
    if (what === 'troops') { act({ k: 'don', p: p.id, g: 'troops', r: ratio, say: 'Truppen an ' + p.name + ' geschickt' }); return; }
    if (what === 'gold') { act({ k: 'don', p: p.id, g: 'gold', say: 'Gold an ' + p.name + ' geschickt' }); return; }
    if (what === 'renew') { act({ k: 'renew', p: p.id }); dropAsk('r' + p.id); return; }
    if (what === 'embargo') { act({ k: 'emb', p: p.id, on: h.embargo.has(p.id) ? 0 : 1 }); return; }
    if (what === 'show') {
      closeModal();
      if (p.nameSize) view.flyTo(p.nameX, p.nameY, within(26 / Math.max(1, p.nameSize) * 1.2, view.cam.z * 0.6, 8));
    }
  }

  // ---------- circle menu ----------
  function closeRadial() {
    $('radial').hidden = true; sel = null;
    if (view) view.mark = -1;
  }
  function openRadial(tile, sx, sy) {
    const h = game.human;
    if (!h.alive) { if (game.owner[tile]) openInfo(game.owner[tile]); return; }
    const a = game.actionsAt(h, tile), R = $('radial');
    sel = a; view.mark = tile;
    R.style.left = within(sx, 118, Math.max(118, view.cw - 118)) + 'px';
    R.style.top = within(sy, 172, Math.max(172, view.ch - 230)) + 'px';
    let cap;
    if (!a.land) cap = 'Wasser';
    else if (a.own) cap = 'Dein Gebiet';
    else if (a.target) cap = a.target.name + ' · ' + fmtT(a.target.troops);
    else cap = (game.fallout[tile] ? 'Verstrahltes Land' : 'Freies Land') + ' · ' + TERRAIN[game.map.mag[tile] < 10 ? 0 : game.map.mag[tile] < 20 ? 1 : 2];
    $('rCap').textContent = cap;
    let mode = '';
    if (a.canAttack) mode = 'attack';
    else if (a.boat) mode = 'boat';
    else if (!a.land && h.cnt[UT.WARSHIP] > 0) mode = 'ship';
    const c = $('rC');
    c.dataset.mode = mode;
    c.classList.toggle('off', !mode);
    c.innerHTML = svg(mode === 'boat' ? 'boat' : mode === 'ship' ? 'warship' : 'sword', 28) + '<span>' + (mode === 'boat' ? 'Boot' : mode === 'ship' ? 'Schiff' : 'Angreifen') + '</span>';
    const near = a.own ? game.structNear(tile, 4) : null, canUp = !!near && near.owner === h && near.built;
    $('rN').firstChild.innerHTML = svg(canUp ? 'up' : 'hammer', 22) + '<span>' + (canUp ? 'Ausbau' : 'Bauen') + '</span>';
    if (canUp) cap = G.UNAME[near.type].replace('\u00AD', '') + ' · Stufe ' + near.level;
    $('rCap').textContent = cap;
    $('rE').disabled = !a.boat;
    const q = a.target, allied = !!q && h.allies.has(q.id), w = $('rW');
    w.classList.toggle('danger', allied);
    w.firstChild.lastChild.textContent = allied ? 'Brechen' : 'Allianz';
    w.disabled = !q || (!allied && !game.canRequestAlliance(h, q));
    R.hidden = false; radialAt = performance.now();
  }
  function radialAct(which) {
    if (!sel || performance.now() - radialAt < 260) return;
    const a = sel, h = game.human;
    if (which === 'C') {
      const mode = $('rC').dataset.mode;
      if (mode === 'attack') act({ k: 'strike', t: a.tile, r: ratio });
      else if (mode === 'boat') sendBoat(a);
      else if (mode === 'ship') act({ k: 'ship', t: a.tile, say: 'Kriegsschiff nimmt Kurs' });
      else toast(a.why || 'Hier nicht möglich');
    } else if (which === 'E') sendBoat(a);
    else if (which === 'N') { closeRadial(); openBuild(a.tile); return; }
    else if (which === 'S') {
      if (a.target) openInfo(a.target.id);
      else if (a.own) openInfo(h.id);
      else toast($('rCap').textContent);
    } else if (which === 'W') {
      const q = a.target;
      if (h.allies.has(q.id)) { infoId = q.id; onModalAct('break'); }
      else act({ k: 'ally', p: q.id, say: 'Anfrage an ' + q.name + ' gesendet' });
    }
    closeRadial();
  }
  function sendBoat(a) {
    act({ k: 'strike', t: a.tile, r: ratio, sea: 1, say: 'Boot läuft aus' });
  }

  // ---------- build menu ----------
  let buildTile = -1;
  function openBuild(tile) {
    const h = game.human;
    buildTile = tile;
    let html = '';
    const near = game.owner[tile] === h.id ? game.structNear(tile, 4) : null;
    if (near && near.owner === h && near.built) {
      const top = G.maxLevel(near.type), max = near.level >= top, room = top - near.level;
      const one = game.cost(h, near.type), rich = game.opts.infiniteGold;
      let bar;
      if (top > 10) bar = '<div class="lvbar" aria-label="Stufe ' + near.level + ' von ' + top + '"><i style="width:' + (100 * near.level / top) + '%"></i></div>';
      else {
        bar = '<div class="pips" aria-label="Stufe ' + near.level + ' von ' + top + '">';
        for (let i = 1; i <= top; i++) bar += '<i' + (i <= near.level ? ' class="on"' : '') + '></i>';
        bar += '</div>';
      }
      // three ways to buy: one level, five levels, or as many as the gold allows
      let btns = '';
      if (!max) {
        const five = Math.min(5, room), all = game.upgradePlan(h, near, room);
        let cost5 = 0;
        for (let i = 0; i < five; i++) cost5 += game.cost(h, near.type, h.cnt[near.type] + i);
        const btn = function (n, label, cost, ok) {
          return '<button class="upbtn" type="button" data-up="' + n + '"' + (ok ? '' : ' disabled') + '><span>' + label + '</span>' + coin(cost) + '</button>';
        };
        btns = '<div class="uprow">' + btn(1, '+1 Stufe', one, rich || h.gold >= one);
        if (room > 1) {
          btns += btn(five, '+' + five + ' Stufen', cost5, rich || h.gold >= cost5);
          btns += btn(all.n || 1, all.n > 1 ? 'Max: +' + all.n : 'Max', all.n ? all.cost : one, all.n > 0);
        }
        btns += '</div>';
      }
      html += '<div class="scard"><div class="shead"><span class="ic big">' + svg(BUILD.find(function (b) { return b.t === near.type; }).icon, 30) + '</span>' +
        '<div class="sinfo"><b>' + G.UNAME[near.type] + ' · Stufe ' + near.level + (top > 10 ? ' von ' + top : '') + '</b>' + bar +
        '<small>Jetzt: ' + levelText(near.type, near.level) + '</small>' +
        (max ? '<small>Höchste Stufe erreicht</small>' : '<small class="next">Stufe ' + (near.level + 1) + ': ' + levelText(near.type, near.level + 1) + '</small>') + '</div></div>' + btns + '</div>';
    }
    const cell = function (b) {
      const nuke = b.t >= UT.ATOM;
      let ok, note, cost = game.cost(h, b.t);
      if (b.t === UT.LASER) {
        const wait = (h.laserAt || 0) - game.ticks;
        ok = wait <= 0 && h.gold >= cost && game.ticks >= game.immuneUntil;
        note = wait > 0 ? 'Lädt noch ' + Math.ceil(wait / 10) + ' s' : game.ticks < game.immuneUntil ? 'Schonfrist läuft noch' : h.gold < cost ? 'Zu wenig Gold' : b.note;
      } else if (nuke) {
        const s = game.readySilo(h, tile);
        ok = s.any && h.gold >= cost;
        note = !s.any ? 'Dafür brauchst du ein Raketensilo' : h.gold < cost ? 'Zu wenig Gold' : 'Ziel wählen und abfeuern';
      } else {
        const c = game.buildCheck(h, b.t, tile);
        ok = c.ok; note = c.ok ? b.note : c.why; cost = c.cost;
      }
      const have = b.t < UT.ATOM ? h.cnt[b.t] : 0;
      return '<button class="item' + (nuke ? ' nuke' : '') + (!game.opts.infiniteGold && h.gold < cost ? ' poor' : '') + '" type="button" data-t="' + b.t + '"' + (ok ? '' : ' disabled') + '><kbd>' + b.key.toUpperCase() + '</kbd>' + (have ? '<i class="own">' + have + '</i>' : '') +
        '<span class="ic">' + svg(b.icon, 24) + '</span><b>' + G.UNAME[b.t] + '</b><small>' + esc(note) + '</small>' + coin(cost) + '</button>';
    };
    html += '<h3>Gebäude</h3><div class="grid">' + BUILD.filter(function (b) { return b.t <= UT.FACTORY; }).map(cell).join('') + '</div>';
    html += '<h3>Flotte und Raketen</h3><div class="grid">' + BUILD.filter(function (b) { return b.t > UT.FACTORY && (b.t !== UT.LASER || game.opts.arsenal); }).map(cell).join('') + '</div>';
    $('sheetBody').innerHTML = html;
    $('purse').innerHTML = svg('gold', 15) + (game.opts.infiniteGold ? '∞' : fmt(h.gold));
    $('sheet').hidden = false;
    view.mark = tile;
    snd('open');
  }
  // Build at a tile, or start aiming a bomb at it. Used by the menu and by the keys.
  function doBuild(t, tile) {
    if (t === UT.LASER && !game.opts.arsenal) { toast('Den Satellitenstrahl gibt es nur im Arsenal-Modus'); snd('deny'); return; }
    if (t === UT.LASER) { startAim(t, tile); return; }
    if (t >= UT.ATOM) {
      const h = game.human, s = game.readySilo(h, tile);
      if (!s.any) { toast('Dafür brauchst du ein Raketensilo'); snd('deny'); return; }
      startAim(t, tile);
      return;
    }
    act({ k: 'build', u: t, t: tile, say: t === UT.WARSHIP ? 'Kriegsschiff läuft aus' : plain(t) + (game.opts.instantBuild ? ' gebaut' : ' wird gebaut') });
  }
  function doUpgrade(tile, n) {
    const u = game.structNear(tile, 4);
    act({ k: 'up', t: tile, n: n || 1, say: (u ? plain(u.type) : 'Gebäude') + ' ausgebaut' });
  }
  function upgradeKind(t) {
    const h = game.human, W = game.W;
    const at = hoverX >= 0 ? view.tileAt(hoverX, hoverY) : -1;
    const px = at >= 0 ? at % W : h.nameX, py = at >= 0 ? (at / W) | 0 : h.nameY;
    let best = null, bd = Infinity;
    for (const u of h.units) {
      if (u.type !== t || !game.canUpgrade(h, u)) continue;
      const d = (u.x - px) * (u.x - px) + (u.y - py) * (u.y - py);
      if (d < bd) { bd = d; best = u; }
    }
    if (!best) { toast(h.cnt[t] ? plain(t) + ': alle schon auf der höchsten Stufe' : 'Du hast noch kein Gebäude dieser Art'); snd('deny'); return; }
    act({ k: 'up', t: best.tile, say: plain(t) + ' ausgebaut auf Stufe ' + (best.level + 1) });
    view.mark = best.tile;
    setTimeout(function () { if (view && view.mark === best.tile && $('sheet').hidden) view.mark = -1; }, 900);
  }
  function closeBuild() { $('sheet').hidden = true; if (view) view.mark = -1; }
  function onBuild(e) {
    const b = e.target.closest('[data-t],[data-up]');
    if (!b || b.disabled) return;
    if (b.dataset.up) doUpgrade(buildTile, +b.dataset.up);
    else {
      const t = +b.dataset.t;
      if (t >= UT.ATOM) closeBuild();
      doBuild(t, buildTile);
      if (t >= UT.ATOM) return;
    }
    closeBuild();
  }

  // ---------- aiming a bomb ----------
  // The map shows the flight path, the blast and every air defence in reach; a tap moves the target.
  function startAim(type, tile) {
    closeRadial();
    aim = { type: type, tile: tile };
    $('ctrl').hidden = true; $('aimBar').hidden = false;
    $('aimIc').innerHTML = svg(BUILD.find(function (b) { return b.t === type; }).icon, 26);
    $('aimName').textContent = G.UNAME[type].replace('­', '');
    refreshAim();
  }
  function stopAim() {
    if (!aim) return;
    aim = null;
    if (view) view.aim = null;
    $('aimBar').hidden = true;
    if (game && game.phase === 'play') $('ctrl').hidden = false;
  }
  function refreshAim() {
    const h = game.human;
    if (!h.alive) { stopAim(); return; }
    const c = game.buildCheck(h, aim.type, aim.tile), W = game.W;
